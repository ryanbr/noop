# Compile-only verification for the macOS and iOS app targets.
#
# Why this exists: the iOS app is a build-from-source community port (no App Store —
# NOOP stays anonymous), so it isn't exercised on a device by the maintainer. This job
# compiles both app targets on every relevant change so a shared-code change can't
# silently break iOS (or regress macOS). It is anonymity-safe: CODE_SIGNING_ALLOWED=NO,
# no secrets, no signing identity, no artifacts uploaded — it only checks that it builds.
# (The shipped macOS .app is still produced and anonymized by hand; this is a compile gate.)
name: App build (macOS + iOS)

on:
  pull_request:
    branches: [main]
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'Packages/**'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  # No `push: main` leg. Every change reaches main through a PR, which the trigger above already
  # gates, so a push run rebuilt content that had just been built - on macOS runners, which GitHub
  # bills at 10x Linux for a two-runner matrix (macos-15 for the universal macOS leg, macos-26 for
  # the iOS 26 SDK). A RELEASE pushes straight to main with no PR, but fork-release.yml builds both
  # Strand and NOOPiOS itself, so that path keeps its own compile gate. The gap this leaves is a
  # direct non-release push to main; `workflow_dispatch` below covers checking one on demand.
  workflow_dispatch:

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # #51: the macOS build must be universal — 'platform=macOS' on an Apple-Silicon runner thins to
          # arm64-only. Use the generic destination + explicit ARCHS so this CI verify catches an x86_64
          # break at PR time (matches the release/testing workflows).
          - scheme: Strand
            destination: 'generic/platform=macOS'
            extra_args: 'ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO'
            runner: macos-15
          # iOS needs the iOS 26 SDK (Liquid Glass's `glassEffect`, landed 2026-07-07) which macos-15's
          # default Xcode doesn't ship — matches the runner fork-testing-build.yml / fork-release.yml
          # already use for their NOOPiOS legs. macos-15 stays correct for the macOS/Strand leg above.
          - scheme: NOOPiOS
            destination: 'generic/platform=iOS Simulator'
            extra_args: ''
            runner: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build ${{ matrix.scheme }}
        run: >-
          xcodebuild -scheme '${{ matrix.scheme }}' -configuration Debug
          -destination '${{ matrix.destination }}' ${{ matrix.extra_args }}
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

      # Run the app-target unit tests (StrandTests, wired into the Strand scheme's test action in
      # project.yml). ONLY the macOS/Strand leg: StrandTests is hosted in the macOS app; the NOOPiOS
      # leg stays compile-only. Uses a concrete (runnable) macOS destination, not the universal
      # generic one above. This is what runs the pure app-target logic tests (backfill continuation,
      # scheduled-report / strain-target policy, etc.) that swift-packages can't reach.
      - name: Test ${{ matrix.scheme }}
        if: matrix.scheme == 'Strand'
        run: >-
          xcodebuild -scheme Strand -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          test

  # Fork-only housekeeping: on-demand app-build runs are dispatched from disposable `ci/<name>` branches
  # (a PR's content pushed somewhere the workflow can run). Once the build finishes (pass OR fail —
  # always()), delete that branch so GitHub's "Compare & pull request" banner doesn't linger after each
  # run. Guarded to ci/-prefixed BRANCH refs only — a dispatch from main or any real branch is untouched.
  cleanup:
    needs: [build]
    if: ${{ always() && github.ref_type == 'branch' && startsWith(github.ref_name, 'ci/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the disposable CI branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}" || true
